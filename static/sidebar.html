<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bert</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* No height:100% layouts: the Help Scout app card is a short iframe that
     sizes itself from content height — the page must flow naturally and stay
     compact (~400px total). */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px; color: #333; background: #fff;
    display: flex; flex-direction: column; padding: 8px; gap: 6px;
  }
  #draft-card {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border: 1px solid #e3e3e3; border-radius: 6px;
    background: #fafafa; font-size: 12px;
  }
  #draft-label { flex: 1; color: #555; }
  #btn-send {
    padding: 6px 10px; border: 1px solid #1e5c22; border-radius: 4px; cursor: pointer;
    background: #2e7d32; color: #fff; font-size: 12px; font-weight: 600;
  }
  #btn-send:disabled { opacity: 0.5; cursor: default; }
  #send-undo {
    display: none; align-items: center; gap: 8px;
    border: 2px solid #2e7d32; border-radius: 6px; background: #f0faf0;
    padding: 8px 10px; font-size: 12px; line-height: 1.4;
  }
  #send-undo .warn { flex: 1; color: #1e5c22; }
  #send-undo .warn b { word-break: break-all; }
  #btn-undo {
    padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;
    background: #2e7d32; color: #fff; font-size: 12px; font-weight: 600;
  }
  #chat {
    height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
    padding: 4px 0;
  }
  .msg { max-width: 92%; padding: 7px 10px; border-radius: 10px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .msg.user  { align-self: flex-end; background: #1f73b7; color: #fff; border-bottom-right-radius: 3px; }
  .msg.bert  { align-self: flex-start; background: #f1f1f1; color: #222; border-bottom-left-radius: 3px; }
  .chip { align-self: center; font-size: 11px; color: #777; background: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 10px; padding: 3px 10px; text-align: center; }
  .chip.error { color: #c62828; background: #fff4f4; border-color: #f5c0c0; }
  .proposal { align-self: stretch; border: 1px solid #d8c46a; border-radius: 6px; background: #fffdf3; padding: 8px; font-size: 12px; }
  .proposal .file { font-weight: 600; margin-bottom: 4px; }
  .proposal pre {
    font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.5;
    background: #fff; border: 1px solid #eee; border-radius: 4px; padding: 6px;
    overflow-x: auto; margin: 6px 0; max-height: 180px; overflow-y: auto;
  }
  .proposal .dline-add { color: #2e7d32; }
  .proposal .dline-del { color: #c62828; }
  .proposal .rationale { color: #666; margin-bottom: 6px; }
  .proposal .actions { display: flex; gap: 6px; }
  .proposal .actions button { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .proposal .btn-confirm { background: #1f73b7; color: #fff; }
  .proposal .btn-dismiss { background: #e0e0e0; color: #333; }
  .proposal .final { font-weight: 600; }
  .proposal .final.confirmed { color: #2e7d32; }
  .proposal .final.dismissed { color: #999; }
  #input-row { display: flex; gap: 6px; align-items: flex-end; }
  #input-row textarea {
    flex: 1; resize: none; height: 42px; max-height: 140px; padding: 6px 8px; font: inherit;
    border: 1px solid #ccc; border-radius: 6px; overflow-y: auto;
  }
  #btn-chat { height: 42px; }
  #btn-chat {
    padding: 0 14px; border: none; border-radius: 6px; cursor: pointer;
    background: #1f73b7; color: #fff; font-size: 12px; font-weight: 500;
  }
  #btn-chat:disabled, #input-row textarea:disabled { opacity: 0.55; cursor: default; }
  .spinner {
    display: inline-block; width: 11px; height: 11px;
    border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%;
    animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading { font-size: 12px; color: #999; }
  #btn-mic {
    width: 42px; height: 42px; flex: none; padding: 0;
    border: 1px solid #ccc; border-radius: 6px; cursor: pointer;
    background: #fff; color: #555;
    display: flex; align-items: center; justify-content: center;
  }
  #btn-mic:hover { background: #f4f4f4; color: #333; }
  #btn-mic:disabled { opacity: 0.55; cursor: default; }
  #record-bar {
    display: none; align-items: center; gap: 8px;
    border: 1px solid #e0b4b4; border-radius: 6px; background: #fff6f6;
    padding: 6px 8px;
  }
  #record-bar.active { display: flex; }
  #waveform {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 2px;
    height: 30px; overflow: hidden;
  }
  #waveform .bar {
    flex: 1; max-width: 4px; height: 3px; border-radius: 2px; background: #d94a4a;
  }
  #rec-timer {
    font-variant-numeric: tabular-nums; font-size: 12px; color: #b03a3a;
    min-width: 30px; text-align: right;
  }
  #btn-rec-cancel, #btn-rec-done {
    flex: none; padding: 7px 10px; border-radius: 6px; cursor: pointer;
    font-size: 12px; font-weight: 600; border: none; line-height: 1;
  }
  #btn-rec-cancel { background: #ececec; color: #444; }
  #btn-rec-done { background: #2e7d32; color: #fff; }
</style>
</head>
<body>
<div id="loading"><span class="spinner"></span>Connecting to Help Scout...</div>
<div id="ui" style="display:none; flex-direction:column; gap:6px;">
  <div id="draft-card">
    <span id="draft-label">Checking for a draft…</span>
    <button id="btn-send" onclick="startSend()" style="display:none">&#9993; Send to customer</button>
  </div>
  <div id="send-undo">
    <span class="warn">&#9993; Emailing <b id="send-recipient">the customer</b> &amp; closing in <b id="send-count">3</b>s…</span>
    <button id="btn-undo" onclick="cancelSend()">Undo</button>
  </div>
  <div id="chat"></div>
  <div id="input-row">
    <textarea id="input" placeholder="Ask Bert about this ticket… (never sent to the customer)"></textarea>
    <button id="btn-mic" onclick="toggleDictation()" title="Dictate" aria-label="Dictate">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <button id="btn-chat" onclick="sendMessage()">Ask</button>
  </div>
  <div id="record-bar">
    <button id="btn-rec-cancel" onclick="endDictation(false)" title="Cancel">&#10005;</button>
    <div id="waveform"></div>
    <span id="rec-timer">0:00</span>
    <button id="btn-rec-done" onclick="endDictation(true)">&#10003; Done</button>
  </div>
</div>
<script>
var CID    = __CID__;
var EMAIL  = __EMAIL__;
var SECRET = __SECRET__;
var lastSeq = 0;
var busy = false;
var pollTimer = null;
var draftExists = false;
var SEND_DELAY_MS = 3000;
var sendTimer = null;
var sendCountdown = null;

// --- Dictation (browser Web Speech API + Web Audio waveform) ---
var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
var recognition = null;
var dictating = false;
var originalText = '';   // textarea contents when dictation started (restored on cancel)
var committed = '';      // finalized transcript appended this session
var restartCount = 0;    // guards against onend flapping
var micStream = null, audioCtx = null, analyser = null, freqData = null, waveRAF = null;
var recSeconds = 0, recTimerId = null;
var INPUT_PLACEHOLDER = '';

if (CID) {
  ready(CID, EMAIL);
} else {
  var ALLOWED_ORIGINS = [
    'https://secure.helpscout.net',
    /^https:\/\/hs-app\..+\.hsenv\.io$/
  ];
  function isAllowed(origin) {
    return ALLOWED_ORIGINS.some(function(o) {
      return typeof o === 'string' ? o === origin : o.test(origin);
    });
  }
  window.addEventListener('message', function(event) {
    if (!isAllowed(event.origin)) return;
    var data = event.data;
    if (!data || data.type !== 'SEND_APP_CONTEXT') return;
    var cid = data.conversation && String(data.conversation.id);
    var emails = data.customer && data.customer.emails;
    var email = (emails && emails.length > 0 && emails[0].value) || '';
    if (cid) ready(cid, email);
  });
  var appId = (window.name || '').replace(/app-side-panel-|app-/, '');
  window.parent.postMessage(
    { type: 'GET_APP_CONTEXT', appId: appId, iframeId: window.name || '' },
    document.referrer || '*'
  );
}

function ready(cid, email) {
  CID = cid; EMAIL = email;
  document.getElementById('loading').style.display = 'none';
  var ui = document.getElementById('ui');
  ui.style.display = 'flex';
  var input = document.getElementById('input');
  INPUT_PLACEHOLDER = input.getAttribute('placeholder');
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  input.addEventListener('input', function() { autoGrow(input); });
  if (Rec) { buildWaveBars(); }
  else { document.getElementById('btn-mic').style.display = 'none'; }
  watchAppHeight();
  fetchDraftState();
  schedulePoll(0);
}

// Ask Help Scout to size the app card to our content (SDK setAppHeight protocol:
// same postMessage envelope as GET_APP_CONTEXT, type SET_APP_HEIGHT).
function sendAppHeight() {
  var h = Math.ceil(document.body.scrollHeight) + 2;
  try {
    window.parent.postMessage(
      {
        type: 'SET_APP_HEIGHT',
        value: h,
        appId: (window.name || '').replace(/app-side-panel-|app-/, ''),
        iframeId: window.name || ''
      },
      document.referrer || '*'
    );
  } catch (e) { /* not inside Help Scout — standalone testing */ }
}

function watchAppHeight() {
  if (window.ResizeObserver) {
    new ResizeObserver(function() { sendAppHeight(); }).observe(document.body);
  }
  sendAppHeight();
}

// Fire a NATIVE Help Scout toast — same postMessage envelope the HS JS SDK's
// showNotification() uses (SHOW_NOTIFICATION). type is one of
// SUCCESS / MESSAGE / WARNING / ERROR.
function hsNotify(type, message) {
  try {
    window.parent.postMessage(
      {
        type: 'SHOW_NOTIFICATION',
        value: { type: type, message: message, options: { id: 'bert-' + Date.now() } },
        appId: (window.name || '').replace(/app-side-panel-|app-/, ''),
        iframeId: window.name || ''
      },
      document.referrer || '*'
    );
  } catch (e) { /* not inside Help Scout — standalone testing */ }
}

async function fetchDraftState() {
  try {
    var resp = await fetch('/chat/draft-state/' + encodeURIComponent(CID) +
      '?secret=' + encodeURIComponent(SECRET));
    if (resp.ok) updateDraftCard(await resp.json());
  } catch (e) { /* card stays in its default state */ }
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function setBusy(b) {
  busy = b;
  document.getElementById('input').disabled = b;
  document.getElementById('btn-chat').disabled = b;
  document.getElementById('btn-mic').disabled = b;
}

function autoGrow(input) {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight + 2, 140) + 'px';
}

async function sendMessage() {
  if (dictating) return;
  var input = document.getElementById('input');
  var text = input.value.trim();
  if (!text || busy) return;
  setBusy(true);
  try {
    var resp = await fetch('/chat/message', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversation_id: CID, customer_email: EMAIL, text: text, secret: SECRET })
    });
    if (resp.status === 409) { setBusy(true); schedulePoll(800); return; }
    if (!resp.ok) { addChip('Send failed: HTTP ' + resp.status, true); setBusy(false); return; }
    input.value = '';
    input.style.height = '';
    schedulePoll(400);
  } catch (e) {
    addChip('Network error: ' + e.message, true);
    setBusy(false);
  }
}

function schedulePoll(delay) {
  if (pollTimer) clearTimeout(pollTimer);
  pollTimer = setTimeout(poll, delay);
}

async function poll() {
  try {
    var resp = await fetch('/chat/messages/' + encodeURIComponent(CID) +
      '?after=' + lastSeq + '&secret=' + encodeURIComponent(SECRET));
    if (resp.ok) {
      var data = await resp.json();
      (data.messages || []).forEach(renderMessage);
      if (data.draft) updateDraftCard(data.draft);
      setBusy(!!data.busy);
    }
  } catch (e) { /* network hiccup — keep polling */ }
  schedulePoll(busy ? 1500 : 10000);
}

function updateDraftCard(draft) {
  draftExists = !!draft.exists;
  document.getElementById('draft-label').textContent =
    draftExists ? 'Draft ready' : 'No draft yet';
  var counting = document.getElementById('send-undo').style.display === 'flex';
  if (!counting) {
    document.getElementById('btn-send').style.display = draftExists ? '' : 'none';
  }
}

function renderMessage(m) {
  if (m.seq <= lastSeq) return;
  lastSeq = m.seq;
  var chat = document.getElementById('chat');
  var el;
  if (m.kind === 'user' || m.kind === 'bert') {
    el = document.createElement('div');
    el.className = 'msg ' + m.kind;
    el.textContent = m.text;
  } else if (m.kind === 'proposal') {
    el = renderProposal(m.payload || {});
  } else {
    el = document.createElement('div');
    el.className = 'chip' + (m.kind === 'error' ? ' error' : '');
    el.textContent = m.text;
  }
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

function renderProposal(p) {
  var el = document.createElement('div');
  el.className = 'proposal';
  el.id = 'proposal-' + p.proposal_id;
  var diffHtml = (p.diff || '').split('\n').map(function(line) {
    var cls = line.charAt(0) === '+' ? 'dline-add' : (line.charAt(0) === '-' ? 'dline-del' : '');
    return '<span class="' + cls + '">' + esc(line) + '</span>';
  }).join('\n');
  el.innerHTML =
    '<div class="file">Policy update: ' + esc(p.policy_file) + '</div>' +
    '<div class="rationale">' + esc(p.rationale) + '</div>' +
    '<pre>' + diffHtml + '</pre>' +
    '<div class="actions"></div>';
  setProposalState(el, p.proposal_id, p.status || 'pending');
  return el;
}

function setProposalState(el, id, status) {
  var actions = el.querySelector('.actions');
  if (status === 'pending') {
    actions.innerHTML =
      '<button class="btn-confirm" onclick="confirmProposal(\'' + id + '\')">Confirm — commit to policies</button>' +
      '<button class="btn-dismiss" onclick="dismissProposal(\'' + id + '\')">Dismiss</button>';
  } else {
    actions.innerHTML = '<span class="final ' + esc(status) + '">' +
      (status === 'confirmed' ? '✓ Confirmed & committed' :
       status === 'dismissed' ? 'Dismissed' : esc(status)) + '</span>';
  }
}

async function confirmProposal(id) {
  var el = document.getElementById('proposal-' + id);
  el.querySelector('.actions').innerHTML = '<span class="spinner"></span> Committing…';
  try {
    var resp = await fetch('/chat/confirm-policy', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversation_id: CID, proposal_id: id, secret: SECRET })
    });
    setProposalState(el, id, resp.ok ? 'confirmed' : 'pending');
    if (!resp.ok) addChip('Policy update failed — see chat for details.', true);
  } catch (e) {
    setProposalState(el, id, 'pending');
    addChip('Network error: ' + e.message, true);
  }
  schedulePoll(300);
}

async function dismissProposal(id) {
  var el = document.getElementById('proposal-' + id);
  try {
    await fetch('/chat/dismiss-policy', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversation_id: CID, proposal_id: id, secret: SECRET })
    });
  } catch (e) { /* leave as-is */ }
  setProposalState(el, id, 'dismissed');
}

function addChip(text, isError) {
  var chat = document.getElementById('chat');
  var el = document.createElement('div');
  el.className = 'chip' + (isError ? ' error' : '');
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

function startSend() {
  if (!draftExists || sendTimer) return;
  document.getElementById('send-recipient').textContent = EMAIL || 'the customer';
  document.getElementById('btn-send').style.display = 'none';
  var countEl = document.getElementById('send-count');
  var remaining = Math.ceil(SEND_DELAY_MS / 1000);
  countEl.textContent = remaining;
  document.getElementById('send-undo').style.display = 'flex';
  sendCountdown = setInterval(function() {
    remaining -= 1;
    if (remaining > 0) countEl.textContent = remaining;
  }, 1000);
  // Hold the API call until the countdown elapses. Undo before then aborts —
  // nothing is sent, because the request never fired.
  sendTimer = setTimeout(function() {
    clearInterval(sendCountdown); sendCountdown = null; sendTimer = null;
    document.getElementById('send-undo').style.display = 'none';
    doSend(false);
  }, SEND_DELAY_MS);
}

function cancelSend() {
  if (sendTimer) { clearTimeout(sendTimer); sendTimer = null; }
  if (sendCountdown) { clearInterval(sendCountdown); sendCountdown = null; }
  document.getElementById('send-undo').style.display = 'none';
  document.getElementById('btn-send').style.display = draftExists ? '' : 'none';
  addChip('Send canceled — nothing was sent.', false);
}

async function doSend(force) {
  var btn = document.getElementById('btn-send');
  btn.disabled = true;
  try {
    var resp = await fetch('/chat/send', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversation_id: CID, secret: SECRET, force: !!force })
    });
    var data = await resp.json().catch(function() { return {}; });
    if (resp.status === 409) {
      if (window.confirm('The draft was edited outside this chat. Email the CURRENT draft to the customer and close anyway?')) {
        btn.disabled = false;
        return doSend(true);
      }
    } else if (!resp.ok) {
      addChip('Send failed: ' + (data.detail || ('HTTP ' + resp.status)), true);
    } else if (data.ok === false && data.sent) {
      hsNotify('SUCCESS', 'Reply sent');
      addChip('Reply sent, but closing failed — retrying close…', true);
      await fetch('/chat/send', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversation_id: CID, secret: SECRET, close_only: true })
      });
    } else if (data.ok) {
      hsNotify('SUCCESS', 'Reply sent');
    }
  } catch (e) {
    addChip('Network error: ' + e.message, true);
  }
  btn.disabled = false;
  schedulePoll(300);
}

// ---- Dictation ----

function buildWaveBars() {
  var wf = document.getElementById('waveform');
  wf.innerHTML = '';
  for (var i = 0; i < 24; i++) {
    var b = document.createElement('div');
    b.className = 'bar';
    wf.appendChild(b);
  }
}

function joinText(base, add) {
  if (!add) return base;
  if (!base) return add;
  return /\s$/.test(base) ? base + add : base + ' ' + add;
}

function toggleDictation() {
  if (dictating) endDictation(true);
  else startDictation();
}

function startDictation() {
  if (busy || dictating || !Rec) return;
  recognition = new Rec();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  recognition.onresult = onRecResult;
  recognition.onerror = onRecError;
  recognition.onend = onRecEnd;
  originalText = document.getElementById('input').value;
  committed = '';
  restartCount = 0;
  dictating = true;
  try { recognition.start(); }
  catch (e) { dictating = false; recognition = null; addChip('Could not start dictation.', true); return; }
  showRecordingUI(true);
  startTimer();
  waveRAF = requestAnimationFrame(drawWave);
  startWaveform();   // best-effort mic-level visualization
}

// endDictation is the single teardown path. keepText=true commits the transcript
// into the textarea for review; false restores what was there before dictation.
function endDictation(keepText) {
  if (!dictating) return;
  dictating = false;
  if (recognition) {
    recognition.onend = null;
    try { recognition.stop(); } catch (e) { /* already stopped */ }
    recognition = null;
  }
  stopTimer();
  if (waveRAF) { cancelAnimationFrame(waveRAF); waveRAF = null; }
  stopWaveform();
  showRecordingUI(false);
  var input = document.getElementById('input');
  input.value = keepText ? joinText(originalText, committed.trim()) : originalText;
  autoGrow(input);
  if (keepText) input.focus();
}

function onRecResult(e) {
  var interim = '';
  for (var i = e.resultIndex; i < e.results.length; i++) {
    var t = e.results[i][0].transcript;
    if (e.results[i].isFinal) committed += t;
    else interim += t;
  }
  var input = document.getElementById('input');
  input.value = joinText(originalText, (committed + interim).trim());
  autoGrow(input);
}

function onRecError(e) {
  var err = e && e.error;
  if (err === 'no-speech' || err === 'aborted') return;   // benign; onend handles it
  if (err === 'not-allowed' || err === 'service-not-allowed') {
    addChip('Microphone blocked — allow mic access to dictate.', true);
    endDictation(false);   // nothing transcribed yet
  } else {
    addChip('Dictation error: ' + (err || 'unknown'), true);
    endDictation(true);    // keep whatever was captured
  }
}

function onRecEnd() {
  if (!dictating) return;   // we tore down deliberately
  // Chrome ends the session after a silence even with continuous=true. Restart to
  // keep listening until the user taps Done/Cancel, with a backstop against flapping.
  if (++restartCount > 40) { endDictation(true); return; }
  try { recognition.start(); } catch (e) { endDictation(true); }
}

function showRecordingUI(on) {
  document.getElementById('record-bar').classList.toggle('active', on);
  document.getElementById('btn-mic').style.display = on ? 'none' : '';
  document.getElementById('btn-chat').style.display = on ? 'none' : '';
  var input = document.getElementById('input');
  input.readOnly = on;
  input.placeholder = on ? 'Listening…' : INPUT_PLACEHOLDER;
}

function startTimer() {
  recSeconds = 0; updateTimerLabel();
  recTimerId = setInterval(function() {
    recSeconds += 1; updateTimerLabel();
    if (recSeconds >= 120) endDictation(true);   // 2-min safety cap
  }, 1000);
}

function stopTimer() {
  if (recTimerId) { clearInterval(recTimerId); recTimerId = null; }
}

function updateTimerLabel() {
  var m = Math.floor(recSeconds / 60), s = recSeconds % 60;
  document.getElementById('rec-timer').textContent = m + ':' + (s < 10 ? '0' : '') + s;
}

async function startWaveform() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var src = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser);
  } catch (e) {
    analyser = null;   // fall back to the idle animated bars
  }
}

function stopWaveform() {
  try {
    if (micStream) { micStream.getTracks().forEach(function(t) { t.stop(); }); micStream = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
  } catch (e) { /* ignore */ }
  analyser = null; freqData = null;
}

function drawWave() {
  if (!dictating) return;
  var bars = document.getElementById('waveform').children;
  var n = bars.length;
  if (analyser) {
    analyser.getByteFrequencyData(freqData);
    var step = Math.max(1, Math.floor(freqData.length / n));
    for (var i = 0; i < n; i++) {
      var v = freqData[i * step] / 255;                 // 0..1
      bars[i].style.height = (3 + v * 25).toFixed(1) + 'px';
    }
  } else {
    var t = Date.now() / 180;
    for (var j = 0; j < n; j++) {
      var w = (Math.sin(t + j * 0.6) + 1) / 2;           // gentle idle wiggle
      bars[j].style.height = (3 + w * 12).toFixed(1) + 'px';
    }
  }
  waveRAF = requestAnimationFrame(drawWave);
}
</script>
</body>
</html>
